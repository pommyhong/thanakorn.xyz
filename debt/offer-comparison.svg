<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1400" height="1050" fill="#ffffff"/>
  <text x="80" y="80" font-size="30" font-weight="700" fill="#1a1a1a">The two options, side by side</text>
  <text x="80" y="118" font-size="21" fill="#8a8a8a">‘Pay once’ and ‘pay in instalments’ at the same level — each with the month figure, the total, and the saving in baht.</text>

  <!-- phone/screen frame -->
  <rect x="150" y="160" width="1100" height="820" rx="34" fill="#fbfbfc" stroke="#dcdcdc" stroke-width="2"/>
  <text x="200" y="235" font-size="26" font-weight="700" fill="#1a1a1a">Choose what works for you</text>
  <text x="200" y="268" font-size="18" fill="#8a8a8a">Two ways out of the same balance. Pick the one that leaves you better off.</text>

  <!-- CARD A · settlement -->
  <rect x="200" y="310" width="480" height="560" rx="18" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>
  <text x="230" y="365" font-size="24" font-weight="700" fill="#1a1a1a">Pay once</text>
  <text x="230" y="395" font-size="16" fill="#8a8a8a">Close the account, with a discount</text>
  <line x1="230" y1="420" x2="650" y2="420" stroke="#eee"/>
  <text x="230" y="470" font-size="18" fill="#8a8a8a">Pay today</text><text x="650" y="470" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="end">฿6,000</text>
  <text x="230" y="520" font-size="18" fill="#8a8a8a">You owe now</text><text x="650" y="520" font-size="20" fill="#8a8a8a" text-anchor="end">฿7,400</text>
  <rect x="230" y="560" width="420" height="78" rx="12" fill="#eafaf1" stroke="#b6e8cd"/>
  <text x="250" y="595" font-size="18" font-weight="700" fill="#2e9e6b">Save ฿1,400</text>
  <text x="250" y="622" font-size="15" fill="#5a9e7c">offer ends 30 Sep</text>
  <rect x="230" y="790" width="420" height="56" rx="28" fill="#2f6bff"/><text x="440" y="825" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">Pay once</text>

  <!-- CARD B · rewrite -->
  <rect x="720" y="310" width="480" height="560" rx="18" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>
  <text x="750" y="365" font-size="24" font-weight="700" fill="#1a1a1a">Pay in instalments</text>
  <text x="750" y="395" font-size="16" fill="#8a8a8a">Keep the account, new terms</text>
  <line x1="750" y1="420" x2="1170" y2="420" stroke="#eee"/>
  <text x="750" y="470" font-size="18" fill="#8a8a8a">Per month</text><text x="1170" y="470" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="end">฿1,200</text>
  <text x="750" y="520" font-size="18" fill="#8a8a8a">Total (5 months)</text><text x="1170" y="520" font-size="20" fill="#8a8a8a" text-anchor="end">฿6,000</text>
  <rect x="750" y="560" width="420" height="78" rx="12" fill="#f4f8ff" stroke="#cfe0ff"/>
  <text x="770" y="595" font-size="18" font-weight="700" fill="#2f6bff">฿1,200 / month · 5 months</text>
  <text x="770" y="622" font-size="15" fill="#5a76b8">new contract needs ID check (KYC)</text>
  <rect x="750" y="790" width="420" height="56" rx="28" fill="#ffffff" stroke="#2f6bff" stroke-width="2"/><text x="960" y="825" font-size="18" fill="#2f6bff" text-anchor="middle" font-weight="600">Pay in instalments</text>

  <text x="700" y="1015" font-size="17" fill="#8a8a8a" text-anchor="middle" font-style="italic">MOCK · rounded numbers (NDA). Point: both named in parallel, month + total + saving in baht + deadline all present.</text>
</svg>
