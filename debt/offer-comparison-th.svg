<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="'Noto Sans Thai','Sarabun',-apple-system,'Segoe UI',sans-serif">
  <rect width="1400" height="1050" fill="#ffffff"/>
  <text x="80" y="80" font-size="30" font-weight="700" fill="#1a1a1a">สองตัวเลือก วางข้างกัน</text>
  <text x="80" y="118" font-size="20" fill="#8a8a8a">จ่ายครั้งเดียว กับ แบ่งจ่ายเป็นงวด อยู่ระดับเดียวกัน — แต่ละอันมียอดต่อเดือน ยอดรวม และส่วนลดเป็นบาท</text>

  <rect x="150" y="160" width="1100" height="820" rx="34" fill="#fbfbfc" stroke="#dcdcdc" stroke-width="2"/>
  <text x="200" y="235" font-size="26" font-weight="700" fill="#1a1a1a">เลือกทางที่เหมาะกับคุณ</text>
  <text x="200" y="268" font-size="18" fill="#8a8a8a">หนี้ก้อนเดียว สองทางออก · เลือกทางที่ทำให้คุณดีกว่า</text>

  <rect x="200" y="310" width="480" height="560" rx="18" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>
  <text x="230" y="365" font-size="24" font-weight="700" fill="#1a1a1a">จ่ายครั้งเดียว</text>
  <text x="230" y="395" font-size="16" fill="#8a8a8a">ปิดบัญชี พร้อมส่วนลด</text>
  <line x1="230" y1="420" x2="650" y2="420" stroke="#eee"/>
  <text x="230" y="470" font-size="18" fill="#8a8a8a">จ่ายวันนี้</text><text x="650" y="470" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="end">฿6,000</text>
  <text x="230" y="520" font-size="18" fill="#8a8a8a">ยอดเดิม</text><text x="650" y="520" font-size="20" fill="#8a8a8a" text-anchor="end">฿7,400</text>
  <rect x="230" y="560" width="420" height="78" rx="12" fill="#eafaf1" stroke="#b6e8cd"/>
  <text x="250" y="595" font-size="18" font-weight="700" fill="#2e9e6b">ประหยัด ฿1,400</text>
  <text x="250" y="622" font-size="15" fill="#5a9e7c">หมดเขต 30 ก.ย.</text>
  <rect x="230" y="790" width="420" height="56" rx="28" fill="#2f6bff"/><text x="440" y="825" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">จ่ายครั้งเดียว</text>

  <rect x="720" y="310" width="480" height="560" rx="18" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>
  <text x="750" y="365" font-size="24" font-weight="700" fill="#1a1a1a">แบ่งจ่ายเป็นงวด</text>
  <text x="750" y="395" font-size="16" fill="#8a8a8a">เก็บบัญชีไว้ เงื่อนไขใหม่</text>
  <line x1="750" y1="420" x2="1170" y2="420" stroke="#eee"/>
  <text x="750" y="470" font-size="18" fill="#8a8a8a">ต่อเดือน</text><text x="1170" y="470" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="end">฿1,200</text>
  <text x="750" y="520" font-size="18" fill="#8a8a8a">รวม (5 เดือน)</text><text x="1170" y="520" font-size="20" fill="#8a8a8a" text-anchor="end">฿6,000</text>
  <rect x="750" y="560" width="420" height="78" rx="12" fill="#f4f8ff" stroke="#cfe0ff"/>
  <text x="770" y="595" font-size="18" font-weight="700" fill="#2f6bff">฿1,200 / เดือน · 5 เดือน</text>
  <text x="770" y="622" font-size="15" fill="#5a76b8">สัญญาใหม่ต้องยืนยันตัวตน (KYC)</text>
  <rect x="750" y="790" width="420" height="56" rx="28" fill="#ffffff" stroke="#2f6bff" stroke-width="2"/><text x="960" y="825" font-size="18" fill="#2f6bff" text-anchor="middle" font-weight="600">แบ่งจ่ายเป็นงวด</text>

  <text x="700" y="1015" font-size="17" fill="#8a8a8a" text-anchor="middle" font-style="italic">MOCK · เลขกลม (NDA) · จุดสำคัญ: ตั้งชื่อสองทางระนาบเดียวกัน + ต่อเดือน + รวม + ประหยัดบาท + เดดไลน์ ครบ</text>
</svg>
