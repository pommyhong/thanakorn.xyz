<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans Thai','Sarabun',-apple-system,'Segoe UI',sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="80" y="80" font-size="30" font-weight="700" fill="#1a1a1a">ตัวจอเอง</text>
  <text x="80" y="118" font-size="20" fill="#8a8a8a">สี่ช่วงที่เราย้ายแรงไป — ตอนเปิด และตอนจบ · MOCK เลขกลม (NDA)</text>

  <!-- 1 · Peak / opening -->
  <g>
    <rect x="90" y="180" width="300" height="600" rx="34" fill="#f4f8ff" stroke="#cfe0ff" stroke-width="2"/>
    <text x="120" y="240" font-size="15" fill="#8a8a8a">โปรแกรมพิเศษสำหรับคุณ</text>
    <text x="120" y="300" font-size="20" fill="#1a1a1a" font-weight="600">ทางออก</text>
    <text x="120" y="326" font-size="20" fill="#1a1a1a" font-weight="600">มีจริง</text>
    <rect x="120" y="360" width="240" height="120" rx="14" fill="#ffffff" stroke="#cfe0ff"/>
    <text x="140" y="400" font-size="15" fill="#8a8a8a">คุณประหยัดได้</text>
    <text x="240" y="452" font-size="40" font-weight="700" fill="#2e9e6b" text-anchor="middle">฿1,400</text>
    <rect x="120" y="700" width="240" height="52" rx="26" fill="#2f6bff"/><text x="240" y="733" font-size="16" fill="#fff" text-anchor="middle">ดูตัวเลือกของฉัน</text>
    <text x="240" y="820" font-size="15" fill="#2f6bff" text-anchor="middle" font-weight="700">พีค · ตอนเปิด</text>
  </g>

  <!-- 2 · End A confirmation -->
  <g>
    <rect x="450" y="180" width="300" height="600" rx="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
    <circle cx="600" cy="320" r="46" fill="#eafaf1" stroke="#b6e8cd"/><path d="M578 320 l14 14 l26 -30" fill="none" stroke="#2e9e6b" stroke-width="5"/>
    <text x="600" y="410" font-size="20" fill="#1a1a1a" font-weight="600" text-anchor="middle">คุณทำสิ่งที่</text>
    <text x="600" y="436" font-size="20" fill="#1a1a1a" font-weight="600" text-anchor="middle">ถูกต้องแล้ว</text>
    <text x="600" y="480" font-size="14" fill="#8a8a8a" text-anchor="middle">ปิดบัญชีแล้ว · ไม่มียอดต้องจ่ายอีก</text>
    <text x="600" y="820" font-size="15" fill="#2e9e6b" text-anchor="middle" font-weight="700">จบ A · ยืนยัน</text>
  </g>

  <!-- 3 · miss deadline -->
  <g>
    <rect x="810" y="180" width="300" height="600" rx="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
    <text x="840" y="240" font-size="15" fill="#8a8a8a">ก่อนกดยืนยัน</text>
    <text x="840" y="290" font-size="18" fill="#1a1a1a" font-weight="600">ถ้าจ่ายไม่ทันวันกำหนด</text>
    <rect x="840" y="320" width="240" height="150" rx="12" fill="#fff9f0" stroke="#f0dcc0"/>
    <text x="860" y="356" font-size="14" fill="#8a8a8a">· ส่วนลดหายไป</text>
    <text x="860" y="388" font-size="14" fill="#8a8a8a">· ยอดกลับเป็น ฿7,400</text>
    <text x="860" y="420" font-size="14" fill="#8a8a8a">· ขอข้อเสนอใหม่ได้อีกครั้ง</text>
    <text x="840" y="700" font-size="13" fill="#8a8a8a">จ่ายเงินสดที่ 7-11 หรือโอน</text>
    <text x="960" y="820" font-size="15" fill="#b6791f" text-anchor="middle" font-weight="700">พูดเรื่องที่น่ากลัวตรงๆ</text>
  </g>

  <!-- 4 · rewrite dashboard -->
  <g>
    <rect x="1170" y="180" width="300" height="600" rx="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
    <text x="1200" y="240" font-size="15" fill="#8a8a8a">แผนของคุณ</text>
    <rect x="1200" y="266" width="240" height="110" rx="12" fill="#f4f8ff" stroke="#cfe0ff"/>
    <text x="1220" y="302" font-size="15" fill="#8a8a8a">งวดถัดไป</text>
    <text x="1420" y="336" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="end">฿1,200</text>
    <text x="1220" y="420" font-size="15" fill="#8a8a8a">จ่ายแล้ว 2 จาก 5</text>
    <rect x="1200" y="436" width="240" height="12" rx="6" fill="#e6ecf5"/><rect x="1200" y="436" width="96" height="12" rx="6" fill="#2f6bff"/>
    <text x="1320" y="820" font-size="15" fill="#2f6bff" text-anchor="middle" font-weight="700">เขียนใหม่ · ยอดใหม่</text>
  </g>
</svg>
